spring.application.name=yoga-poseperfect

# ── Database ──────────────────────────────────────────────
spring.datasource.url=jdbc:mysql://localhost:3306/yoga_db?useSSL=false&allowPublicKeyRetrieval=true
spring.datasource.username=root
spring.datasource.password=
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# ── JPA / Hibernate ──────────────────────────────────────
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect

# ── Server ────────────────────────────────────────────────
server.port=8085

# ── File Upload ───────────────────────────────────────────
spring.servlet.multipart.max-file-size=50MB
spring.servlet.multipart.max-request-size=50MB

# ── Static Resources ─────────────────────────────────────
spring.web.resources.static-locations=file:uploads/

# ── JWT ───────────────────────────────────────────────────
# IMPORTANT: Replace this secret with a strong random key in production
jwt.secret=YogaPosePerfect2024SecretKeyForJWTTokenGeneration!@#$%MinimumLength
jwt.expiration=86400000

# ── Swagger / OpenAPI ─────────────────────────────────────
springdoc.api-docs.path=/v3/api-docs
springdoc.swagger-ui.path=/swagger-ui.html
